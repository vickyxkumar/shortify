spring.application.name=shortify
spring.config.import=optional:file:.env[.properties]
# logging.level.org.springframework.core.env=DEBUG

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRECT}
jwt.expiration=${JWT_EXPIRATION}

spring.data.redis.host=${REDIS_HOSTNAME}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=${REDIS_TIMEOUT}

MACHINE_ID=${MACHINE_ID}

#rate limiter (disable or raise for load tests)
ratelimit.enabled=${RATELIMIT_ENABLED:true}
ratelimit.limit=${RATELIMIT_LIMIT:10}

#kafka config
spring.kafka.bootstrap-servers=${SERVER_URL}
spring.kafka.producer.value-serializer=${PRODUCER_VALUE_SERIALIZER}
spring.kafka.producer.key-serializer=${PRODUCER_KEY_SERIALIZER}

spring.kafka.consumer.group-id=${CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=${CONSUMER_AUTO_OFFSET_RESET}
spring.kafka.consumer.enable-auto-commit=${CONSUMER_ENABLE_AUTO_COMMIT}

spring.kafka.consumer.value-deserializer=${CONSUMER_VALUE_SERIALIZER}
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=${CONSUMER_VALUE_DESERIALIZER_VALUE_DELEGATE}

spring.kafka.consumer.properties.spring.json.value.default.type=${CONSUMER_JSON_VALUE_DEFAULT_TYPE}
spring.kafka.consumer.properties.spring.json.trusted.packages=${CONSUMER_JSON_TRUSTED_PACKAGE}
