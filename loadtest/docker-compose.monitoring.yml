# Optional monitoring stack. Run together with the main compose file (from the repo root):
#   docker compose -f docker-compose.yml -f loadtest/docker-compose.monitoring.yml up -d
# Grafana: http://localhost:3000 (admin/admin) -> Dashboards -> "Shortify load test" (auto-provisioned)
# Paths below resolve from the first -f file's directory (repo root).
services:

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: shortify-prometheus
    volumes:
      - ./loadtest/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.1.0
    container_name: shortify-grafana
    depends_on:
      - prometheus
    volumes:
      - ./loadtest/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./loadtest/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    mem_limit: 256m

  # CPU / memory / throttling for every container (reads the docker cgroups)
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    container_name: shortify-cadvisor
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    mem_limit: 256m

  # Postgres internals: transactions, connections by state, cache hit ratio, rows inserted
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: shortify-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://shortify:shortify@postgres:5432/shortify?sslmode=disable
    ports:
      - "9187:9187"
    mem_limit: 64m

  # Redis internals: ops/s, hit/miss, memory, clients
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: shortify-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    mem_limit: 64m

  # Kafka internals: produce rate per topic, consumer group lag
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: shortify-kafka-exporter
    command:
      - --kafka.server=kafka:29092
    restart: on-failure
    ports:
      - "9308:9308"
    mem_limit: 64m
